name: CAWS Quality Gates
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main, develop]

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      risk: ${{ steps.risk.outputs.tier }}
      should_run_all: ${{ steps.risk.outputs.should_run_all }}
      experiment_mode: ${{ steps.risk.outputs.experiment_mode }}
      has_waivers: ${{ steps.waivers.outputs.has_waivers }}
      coverage_waived: ${{ steps.waivers.outputs.coverage_waived }}
      mutation_waived: ${{ steps.waivers.outputs.mutation_waived }}
      contracts_waived: ${{ steps.waivers.outputs.contracts_waived }}
    steps:
      - uses: actions/checkout@v4

      - name: Parse Working Spec
        id: risk
        run: |
          # Check if working spec exists
          if [ -f ".caws/working-spec.yml" ] || [ -f ".caws/working-spec.yaml" ]; then
            # Extract risk tier (default to 2 if parsing fails)
            TIER=$(yq -r '.risk_tier // 2' .caws/working-spec.y*ml)
            EXPERIMENT=$(yq -r '.experiment_mode // false' .caws/working-spec.y*ml)
            echo "tier=$TIER" >> $GITHUB_OUTPUT
            echo "should_run_all=true" >> $GITHUB_OUTPUT
            echo "experiment_mode=$EXPERIMENT" >> $GITHUB_OUTPUT
          else
            echo "tier=2" >> $GITHUB_OUTPUT
            echo "should_run_all=false" >> $GITHUB_OUTPUT
            echo "experiment_mode=false" >> $GITHUB_OUTPUT
          fi

      - name: Check Waivers
        id: waivers
        run: |
          # Initialize waiver flags
          echo "has_waivers=false" >> $GITHUB_OUTPUT
          echo "coverage_waived=false" >> $GITHUB_OUTPUT
          echo "mutation_waived=false" >> $GITHUB_OUTPUT
          echo "contracts_waived=false" >> $GITHUB_OUTPUT

          # Check if waivers file exists and has active waivers
          if [ -f ".caws/waivers.yml" ]; then
            # Check for active waivers using the waivers tool
            if command -v npx &> /dev/null; then
              npx tsx apps/tools/caws/waivers.ts cleanup > /dev/null 2>&1 || true

              # Check each gate for waivers
              if npx tsx apps/tools/caws/waivers.ts list | grep -q "coverage"; then
                echo "coverage_waived=true" >> $GITHUB_OUTPUT
                echo "has_waivers=true" >> $GITHUB_OUTPUT
              fi
              if npx tsx apps/tools/caws/waivers.ts list | grep -q "mutation"; then
                echo "mutation_waived=true" >> $GITHUB_OUTPUT
                echo "has_waivers=true" >> $GITHUB_OUTPUT
              fi
              if npx tsx apps/tools/caws/waivers.ts list | grep -q "contracts"; then
                echo "contracts_waived=true" >> $GITHUB_OUTPUT
                echo "has_waivers=true" >> $GITHUB_OUTPUT
              fi
            fi
          fi

      - name: Validate Working Spec
        if: steps.risk.outputs.should_run_all == 'true'
        run: |
          if [ -f ".caws/working-spec.yml" ] || [ -f ".caws/working-spec.yaml" ]; then
            npx tsx apps/tools/caws/validate.ts working-spec .caws/working-spec.y*ml
          fi

  static:
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type checking
        run: npm run typecheck

      - name: Lint code
        run: npm run lint

      - name: Security audit
        run: npm run dep:audit

      - name: Dependency check
        run: npm run dep:check

      - name: Accessibility validation
        run: npm run caws:accessibility

      - name: Secret scan (trufflehog)
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: main
          head: HEAD
          extra_args: --debug --only-verified

      - name: SAST Security Scan (Snyk)
        uses: snyk/actions/node@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high --all-projects --json
        continue-on-error: true

      - name: Upload SAST results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sast-results
          path: snyk-report.json
          retention-days: 30

  unit:
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests with coverage
        run: npm run test:coverage

      - name: Upload coverage reports
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage/lcov.info
          flags: unittests
          name: codecov-umbrella

      - name: Enforce Branch Coverage
        if: needs.setup.outputs.coverage_waived != 'true' && needs.setup.outputs.experiment_mode != 'true'
        run: npm run gates:coverage -- ${{ needs.setup.outputs.risk }}

      - name: Archive test results
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: coverage/
          retention-days: 30

  mutation:
    needs: [setup, unit]
    runs-on: ubuntu-latest
    if: needs.setup.outputs.risk != '3' && needs.setup.outputs.experiment_mode != 'true' && needs.setup.outputs.mutation_waived != 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }

      - name: Install dependencies
        run: npm ci

      - name: Run mutation tests
        run: npm run test:mutation

      - name: Enforce Mutation Score
        if: needs.setup.outputs.mutation_waived != 'true'
        run: npm run gates:mutation -- ${{ needs.setup.outputs.risk }}

      - name: Archive mutation reports
        uses: actions/upload-artifact@v4
        with:
          name: mutation-test-results
          path: reports/mutation/
          retention-days: 30

  contracts:
    needs: setup
    runs-on: ubuntu-latest
    if: needs.setup.outputs.should_run_all == 'true' && needs.setup.outputs.experiment_mode != 'true' && needs.setup.outputs.contracts_waived != 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }

      - name: Install dependencies
        run: npm ci

      - name: Run contract tests
        run: npm run test:contract

      - name: Validate contracts against tier
        if: needs.setup.outputs.contracts_waived != 'true'
        run: npm run gates:contracts -- ${{ needs.setup.outputs.risk }}

  integration:
    needs: [setup]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: testdb
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U postgres -d testdb"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL: postgresql://postgres:testpass@localhost:5432/testdb
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }

      - name: Install dependencies
        run: npm ci

      - name: Wait for PostgreSQL
        run: |
          until pg_isready -h localhost -p 5432 -U postgres; do
            echo "Waiting for PostgreSQL..."
            sleep 2
          done

      - name: Run integration tests
        run: npm run test:integration

  e2e_a11y:
    needs: [integration]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run E2E smoke tests
        run: npm run test:e2e

      - name: Run accessibility tests
        run: npm run test:e2e:axe

      - name: Validate accessibility compliance
        run: npm run caws:accessibility

      - name: Upload E2E screenshots on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-screenshots
          path: test-results/
          retention-days: 30

  perf:
    needs: [integration]
    runs-on: ubuntu-latest
    if: needs.setup.outputs.risk != '3'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }

      - name: Install dependencies
        run: npm ci

      - name: Run performance benchmarks
        run: npx tsx apps/tools/caws/perf-budgets.ts --real-data

      - name: Archive performance results
        uses: actions/upload-artifact@v4
        with:
          name: performance-results
          path: perf-results/
          retention-days: 30

  flake_detection:
    needs: [unit]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }

      - name: Install dependencies
        run: npm ci

      - name: Download test artifacts
        uses: actions/download-artifact@v4
        with:
          name: unit-test-results
          path: test-results/

      - name: Run flake detection
        run: npx tsx apps/tools/caws/flake-detector.ts detect

      - name: Get flake detection status
        run: npx tsx apps/tools/caws/flake-detector.ts status

      - name: Archive flake detection results
        uses: actions/upload-artifact@v4
        with:
          name: flake-detection-results
          path: .caws/
          retention-days: 30

  feature_flags:
    needs: [setup]
    runs-on: ubuntu-latest
    if: needs.setup.outputs.should_run_all == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }

      - name: Install dependencies
        run: npm ci

      - name: Validate feature flags
        run: npx tsx apps/tools/caws/feature-flags.ts list

      - name: Get feature flag statistics
        run: npx tsx apps/tools/caws/feature-flags.ts stats

      - name: Archive feature flag state
        uses: actions/upload-artifact@v4
        with:
          name: feature-flags-state
          path: .caws/feature-flags.json
          retention-days: 30

  provenance_trust:
    needs: [static, unit, mutation, contracts, integration, e2e_a11y, perf, flake_detection, feature_flags]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }

      - name: Install dependencies
        run: npm ci

      - name: Download test artifacts
        uses: actions/download-artifact@v4
        with:
          name: unit-test-results
          path: coverage/

      - name: Generate Provenance Manifest
        run: npm run caws:provenance

      - name: Validate Provenance Manifest
        run: npm run caws:validate provenance .agent/provenance.json

      - name: Calculate and Enforce Trust Score
        run: npm run gates:trust -- ${{ needs.setup.outputs.risk }}

      - name: Archive provenance
        uses: actions/upload-artifact@v4
        with:
          name: provenance-manifest
          path: .agent/provenance.json
          retention-days: 90

  # Manual review gate for Tier 1
  manual_review_gate:
    needs: [provenance_trust]
    runs-on: ubuntu-latest
    if: needs.setup.outputs.risk == '1'
    environment: production
    steps:
      - name: Wait for Manual Review
        run: |
          echo "Tier 1 changes require manual review before merge"
          echo "Please review the PR and approve if quality gates are met"

      - name: Manual Approval Required
        run: |
          echo "This step will wait for manual approval in the GitHub UI"
          echo "Navigate to the PR → Environments → production → Approve deployment"

  # Final merge gate
  merge_gate:
    needs: [provenance_trust, manual_review_gate]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: All Gates Passed
        if: needs.provenance_trust.result == 'success' && (needs.manual_review_gate.result == 'success' || needs.setup.outputs.risk != '1')
        run: |
          echo "🎉 All CAWS quality gates passed!"
          if [ "${{ needs.setup.outputs.has_waivers }}" = "true" ]; then
            echo "⚠️  Note: Some quality gates were waived for this change"
            echo "   Coverage waived: ${{ needs.setup.outputs.coverage_waived }}"
            echo "   Mutation waived: ${{ needs.setup.outputs.mutation_waived }}"
            echo "   Contracts waived: ${{ needs.setup.outputs.contracts_waived }}"
          fi
          if [ "${{ needs.setup.outputs.experiment_mode }}" = "true" ]; then
            echo "🧪 Note: This is an experimental feature with reduced requirements"
          fi
          echo "PR is ready for merge"

      - name: Gates Failed
        if: needs.provenance_trust.result == 'failure' || needs.manual_review_gate.result == 'failure'
        run: |
          echo "❌ Quality gates failed"
          echo "Please address the issues before merging"
          exit 1
